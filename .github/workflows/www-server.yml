name: Platform — Landing Page

on:
  push:
    branches: [main]
    paths:
      - "platform/www-server/**"
      - ".github/workflows/www-server.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        default: "deploy"
        type: choice
        options: [deploy, uninstall]

jobs:
  deploy:
    name: ${{ github.event.inputs.action || 'deploy' }} landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VM_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: "platform/www-server/"
          target: "/home/ubuntu/platform/"
          strip_components: 0

      - name: Deploy
        if: github.event.inputs.action != 'uninstall'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VM_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            chmod +x /home/ubuntu/platform/platform/www-server/install.sh
            bash /home/ubuntu/platform/platform/www-server/install.sh

      - name: Uninstall
        if: github.event.inputs.action == 'uninstall'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VM_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            kubectl delete -f /home/ubuntu/platform/platform/www-server/k8s/ || true

      - name: Print URL
        if: github.event.inputs.action != 'uninstall'
        run: |
          echo "Landing page: http://${{ vars.VM_PUBLIC_IP }}/"
