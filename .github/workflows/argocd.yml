name: Platform — ArgoCD

on:
  push:
    branches: [main]
    paths:
      - "platform/argocd/**"
      - ".github/workflows/argocd.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        default: "deploy"
        type: choice
        options: [deploy, uninstall]

jobs:
  deploy:
    name: ${{ github.event.inputs.action || 'deploy' }} argocd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VM_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: "platform/argocd/"
          target: "/home/ubuntu/platform/"
          strip_components: 0

      - name: Deploy
        if: github.event.inputs.action != 'uninstall'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VM_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            chmod +x /home/ubuntu/platform/platform/argocd/install.sh
            bash /home/ubuntu/platform/platform/argocd/install.sh
        timeout: 600s

      - name: Uninstall
        if: github.event.inputs.action == 'uninstall'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VM_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            helm uninstall argocd --namespace argocd || true
            kubectl delete namespace argocd --ignore-not-found

      - name: Print ArgoCD URL
        if: github.event.inputs.action != 'uninstall'
        run: |
          echo "ArgoCD: http://${{ vars.VM_PUBLIC_IP }}/argocd"
          echo "Username: admin"
