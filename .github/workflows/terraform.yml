name: Terraform — Infra

on:
  push:
    branches: [main]
    paths:
      - "terraform/infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform/infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write   # required for OIDC token issuance
  contents: write   # required to push updated terraform.tfstate back to the repo
  pull-requests: write

env:
  TF_DIR: terraform/infra
  TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}

jobs:
  # ------------------------------------------------------------------
  # PR check — no AWS creds needed, just lint and validate
  # ------------------------------------------------------------------
  validate:
    name: Terraform Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

  # ------------------------------------------------------------------
  # Push to main / workflow_dispatch — full plan + apply
  # ------------------------------------------------------------------
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -out=tfplan \
            -input=false \
            -no-color 2>&1 | tee plan.txt

      - name: Terraform Apply
        if: >
          github.event.inputs.action == 'apply' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve -input=false

      - name: Commit updated Terraform state
        if: >
          github.event.inputs.action == 'apply' ||
          github.event.inputs.action == 'destroy' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add terraform/infra/terraform.tfstate
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update terraform infra state [skip ci]"
            git push origin main
          fi

      - name: Show Outputs
        if: >
          github.event.inputs.action == 'apply' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: ${{ env.TF_DIR }}
        run: terraform output
