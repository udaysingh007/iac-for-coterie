name: Terraform — Infra

on:
  push:
    branches: [main]
    paths:
      - "terraform/infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform/infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write   # required for OIDC token issuance
  contents: write   # required to push updated terraform.tfstate back to the repo
  pull-requests: write

env:
  TF_DIR: terraform/infra
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || (github.event_name == 'pull_request' && 'plan') || 'apply' }}
    runs-on: ubuntu-latest
    environment: ${{ (github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'production' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can push the updated state back
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -out=tfplan \
            -input=false \
            -no-color 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Terraform Apply
        if: >
          github.event.inputs.action == 'apply' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve -input=false

      - name: Commit updated Terraform state
        if: >
          github.event.inputs.action == 'apply' ||
          github.event.inputs.action == 'destroy' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest to avoid conflicts (state is only written by this workflow)
          git pull --rebase origin main

          git add terraform/infra/terraform.tfstate
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update terraform infra state [skip ci]"
            git push origin main
          fi

      - name: Show Outputs
        if: >
          github.event.inputs.action == 'apply' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: ${{ env.TF_DIR }}
        run: terraform output
