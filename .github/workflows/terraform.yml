name: Terraform — Infra

on:
  pull_request:
    paths:
      - "terraform/infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

permissions:
  contents: write

env:
  TF_DIR: terraform/infra
  TF_VAR_admin_ssh_public_key: ${{ secrets.ADMIN_SSH_PUBLIC_KEY }}

jobs:
  validate:
    name: Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"

      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      - name: Format check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

  deploy:
    name: ${{ github.event.inputs.action || 'apply' }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"

      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -out=tfplan -input=false -no-color

      - name: Apply
        if: github.event.inputs.action != 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve -input=false

      - name: Commit state
        if: github.event.inputs.action != 'plan'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/infra/terraform.tfstate
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update terraform infra state [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Outputs
        if: github.event.inputs.action != 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform output
