apiVersion: v1
kind: ServiceAccount
metadata:
  name: runbook-controller
  namespace: alerting
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runbook-controller
  namespace: alerting
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runbook-controller
  namespace: alerting
subjects:
  - kind: ServiceAccount
    name: runbook-controller
    namespace: alerting
roleRef:
  kind: Role
  name: runbook-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runbook-controller
  namespace: alerting
  labels:
    app: runbook-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runbook-controller
  template:
    metadata:
      labels:
        app: runbook-controller
    spec:
      serviceAccountName: runbook-controller
      containers:
        - name: controller
          image: localhost:5000/runbook-controller:latest
          ports:
            - containerPort: 8081
          env:
            - name: GMAIL_USER
              value: "usingh@gmail.com"
            - name: ALERT_RECIPIENT
              value: "usingh@gmail.com"
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmail-credentials
                  key: app-password
            - name: CONTROLLER_EXTERNAL_URL
              value: "http://13.216.126.57:30080"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: runbook-controller
  namespace: alerting
spec:
  type: NodePort
  selector:
    app: runbook-controller
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30080
