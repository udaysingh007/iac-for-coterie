apiVersion: v1
kind: ConfigMap
metadata:
  name: runbook-controller-script
  namespace: alerting
data:
  app.py: |
    """Runbook controller: receives Grafana webhook, emails approval link, reverts via GitHub API on approval."""
    import base64
    import hashlib
    import json
    import os
    import re
    import smtplib
    import time
    import uuid
    from email.mime.text import MIMEText
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse
    from urllib.request import Request, urlopen
    from urllib.error import HTTPError

    GMAIL_USER = os.environ["GMAIL_USER"]
    GMAIL_APP_PASSWORD = os.environ["GMAIL_APP_PASSWORD"]
    ALERT_RECIPIENT = os.environ.get("ALERT_RECIPIENT", GMAIL_USER)
    CONTROLLER_EXTERNAL_URL = os.environ["CONTROLLER_EXTERNAL_URL"]
    GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]
    GITHUB_REPO = os.environ.get("GITHUB_REPO", "udaysingh007/sre-take-home")
    GITHUB_BRANCH = os.environ.get("GITHUB_BRANCH", "main")
    KUSTOMIZATION_PATH = "k8s/overlays/dev/kustomization.yaml"

    pending_approvals = {}

    REMEDIATION = {
        "desc": "Revert dev image tag to previous version via GitHub API",
        "summary": "Roll back candidate-api to the previous known-good image by updating the Git manifest (GitOps rollback)",
    }

    def github_api(path, method="GET", data=None):
        url = f"https://api.github.com/{path}"
        headers = {
            "Authorization": f"token {GITHUB_TOKEN}",
            "Accept": "application/vnd.github.v3+json",
            "User-Agent": "runbook-controller",
        }
        body = None
        if data:
            headers["Content-Type"] = "application/json"
            body = json.dumps(data).encode()
        req = Request(url, data=body, headers=headers, method=method)
        try:
            with urlopen(req, timeout=30) as resp:
                return json.loads(resp.read())
        except HTTPError as e:
            error_body = e.read().decode()
            raise Exception(f"GitHub API {e.code}: {error_body}")

    def generate_token(alert_id):
        raw = f"{alert_id}-{time.time()}-{uuid.uuid4().hex}"
        return hashlib.sha256(raw.encode()).hexdigest()[:32]

    def send_email(to, subject, body_html):
        msg = MIMEText(body_html, "html")
        msg["Subject"] = subject
        msg["From"] = GMAIL_USER
        msg["To"] = to
        with smtplib.SMTP("smtp.gmail.com", 587) as s:
            s.starttls()
            s.login(GMAIL_USER, GMAIL_APP_PASSWORD)
            s.send_message(msg)
        print(f"Email sent to {to}: {subject}")

    def run_remediation(token):
        entry = pending_approvals[token]
        print(f"Running GitOps remediation for token {token}")
        try:
            # 1. Get recent commits that modified the kustomization file
            commits = github_api(
                f"repos/{GITHUB_REPO}/commits?path={KUSTOMIZATION_PATH}&sha={GITHUB_BRANCH}&per_page=5"
            )
            if len(commits) < 2:
                raise Exception("No previous commit found to roll back to")

            # 2. Get the file content at the previous commit
            prev_sha = commits[1]["sha"]
            prev_file = github_api(
                f"repos/{GITHUB_REPO}/contents/{KUSTOMIZATION_PATH}?ref={prev_sha}"
            )
            prev_content = base64.b64decode(prev_file["content"]).decode()

            # Extract previous tag for the log message
            prev_tag_match = re.search(r'newTag:\s*"?([^"\s]+)"?', prev_content)
            prev_tag = prev_tag_match.group(1) if prev_tag_match else "unknown"

            # 3. Get current file SHA (required by GitHub Contents API for updates)
            current_file = github_api(
                f"repos/{GITHUB_REPO}/contents/{KUSTOMIZATION_PATH}?ref={GITHUB_BRANCH}"
            )
            current_sha = current_file["sha"]

            # 4. Commit the previous version of the file
            update_data = {
                "message": (
                    f"fix: automated rollback — revert dev image to {prev_tag}\n\n"
                    "Triggered by runbook-controller after SLO availability alert.\n\n"
                    "[skip ci]"
                ),
                "content": base64.b64encode(prev_content.encode()).decode(),
                "sha": current_sha,
                "branch": GITHUB_BRANCH,
            }
            result = github_api(
                f"repos/{GITHUB_REPO}/contents/{KUSTOMIZATION_PATH}",
                method="PUT",
                data=update_data,
            )

            new_commit = result["commit"]["sha"][:8]
            output = (
                f"Rolled back {KUSTOMIZATION_PATH} to image tag: {prev_tag}\n"
                f"Based on previous commit: {prev_sha[:8]}\n"
                f"New rollback commit: {new_commit}\n"
                f"ArgoCD will auto-sync the change within ~3 minutes."
            )
            entry["status"] = "executed"
            entry["result"] = output
            print(f"Remediation succeeded: {output}")
            return True, output

        except Exception as e:
            entry["status"] = "failed"
            entry["result"] = str(e)
            print(f"Remediation failed: {e}")
            return False, str(e)

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            # Strip /runbook prefix (Traefik middleware strips it, but handle both)
            path = self.path.rstrip("/")
            if path == "/webhook":
                content_len = int(self.headers.get("Content-Length", 0))
                body = self.rfile.read(content_len)
                try:
                    alert_data = json.loads(body)
                except json.JSONDecodeError:
                    alert_data = {"raw": body.decode(errors="replace")}

                alert_id = str(uuid.uuid4())[:8]
                token = generate_token(alert_id)
                pending_approvals[token] = {
                    "status": "pending",
                    "alert_data": alert_data,
                    "created_at": time.time(),
                }

                approve_url = f"{CONTROLLER_EXTERNAL_URL}/approve/{token}"
                subject = "candidate-api Alert — Approval Required for Rollback"
                body_html = f"""
                <h2>candidate-api SLO Alert Fired</h2>
                <p>Availability has dropped below the 99.9% SLO target.</p>
                <p><strong>Alert ID:</strong> {alert_id}</p>
                <p><strong>Time:</strong> {time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}</p>
                <h3>Proposed Remediation (GitOps)</h3>
                <p><code>{REMEDIATION['desc']}</code></p>
                <p>{REMEDIATION['summary']}</p>
                <br>
                <a href="{approve_url}"
                   style="background-color:#28a745;color:white;padding:12px 24px;
                          text-decoration:none;border-radius:4px;font-size:16px;">
                   Approve Rollback
                </a>
                <br><br>
                <p style="color:#666;font-size:12px;">
                  Or copy this URL: {approve_url}
                </p>
                """
                send_email(ALERT_RECIPIENT, subject, body_html)

                self.send_response(200)
                self.end_headers()
                self.wfile.write(json.dumps({"status": "email_sent", "token": token}).encode())
                return

            self.send_response(404)
            self.end_headers()

        def do_GET(self):
            parsed = urlparse(self.path)
            path = parsed.path.rstrip("/")

            if path == "/pending":
                rows = ""
                for token, entry in sorted(
                    pending_approvals.items(),
                    key=lambda x: x[1]["created_at"],
                    reverse=True,
                ):
                    created = time.strftime(
                        '%Y-%m-%d %H:%M:%S UTC', time.gmtime(entry["created_at"])
                    )
                    status = entry["status"]
                    if status == "pending":
                        action = (
                            f'<a href="{CONTROLLER_EXTERNAL_URL}/approve/{token}" '
                            f'style="background-color:#28a745;color:white;padding:6px 16px;'
                            f'text-decoration:none;border-radius:4px;">Approve</a>'
                        )
                    else:
                        action = f'<span style="color:#6c757d;">{status}</span>'
                    rows += f"<tr><td>{created}</td><td>{status}</td><td>{action}</td></tr>"

                if not rows:
                    rows = '<tr><td colspan="3" style="text-align:center;color:#888;">No alerts received yet</td></tr>'

                self.send_response(200)
                self.end_headers()
                self.wfile.write(f"""
                <html><head><title>Runbook Controller</title></head>
                <body style="font-family:sans-serif;max-width:700px;margin:40px auto;">
                <h2>Runbook Controller &mdash; Pending Approvals</h2>
                <p>Remediation: <code>{REMEDIATION['desc']}</code></p>
                <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;">
                <tr style="background:#f0f0f0;"><th>Time</th><th>Status</th><th>Action</th></tr>
                {rows}
                </table>
                <br><p style="color:#888;font-size:12px;">Auto-refreshes every 15s</p>
                <script>setTimeout(()=>location.reload(), 15000);</script>
                </body></html>
                """.encode())
                return

            if path.startswith("/approve/"):
                token = path.split("/approve/", 1)[1]

                if not token or token not in pending_approvals:
                    self.send_response(400)
                    self.end_headers()
                    self.wfile.write(b"""
                    <html><body style="font-family:sans-serif;max-width:600px;margin:40px auto;">
                    <h2 style="color:#dc3545;">Invalid or Expired Token</h2>
                    <p>This approval link is no longer valid.</p>
                    </body></html>""")
                    return

                entry = pending_approvals[token]
                if entry["status"] != "pending":
                    self.send_response(200)
                    self.end_headers()
                    self.wfile.write(f"""
                    <html><body style="font-family:sans-serif;max-width:600px;margin:40px auto;">
                    <h2 style="color:#6c757d;">Already Processed</h2>
                    <p><strong>Status:</strong> {entry['status']}</p>
                    <h3>Output:</h3>
                    <pre>{entry.get('result', '')}</pre>
                    </body></html>""".encode())
                    return

                entry["status"] = "approved"
                success, output = run_remediation(token)

                self.send_response(200)
                self.end_headers()
                status_color = "#28a745" if success else "#dc3545"
                self.wfile.write(f"""
                <html><body style="font-family:sans-serif;max-width:600px;margin:40px auto;">
                <h2 style="color:{status_color};">
                  Rollback {'Executed Successfully' if success else 'Failed'}
                </h2>
                <h3>Remediation:</h3>
                <pre>{REMEDIATION['desc']}</pre>
                <h3>Output:</h3>
                <pre>{output}</pre>
                </body></html>
                """.encode())
                return

            if parsed.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return

            self.send_response(404)
            self.end_headers()

        def log_message(self, format, *args):
            print(f"{self.address_string()} - {format % args}")

    if __name__ == "__main__":
        port = int(os.environ.get("PORT", "8081"))
        server = HTTPServer(("0.0.0.0", port), Handler)
        print(f"Runbook controller listening on :{port}")
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runbook-controller
  namespace: alerting
  labels:
    app: runbook-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runbook-controller
  template:
    metadata:
      labels:
        app: runbook-controller
    spec:
      containers:
        - name: controller
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8081
          env:
            - name: GMAIL_USER
              value: "usingh@gmail.com"
            - name: ALERT_RECIPIENT
              value: "usingh@gmail.com"
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmail-credentials
                  key: app-password
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: token
            - name: GITHUB_REPO
              value: "udaysingh007/sre-take-home"
            - name: GITHUB_BRANCH
              value: "main"
            - name: CONTROLLER_EXTERNAL_URL
              value: "http://13.216.126.57/runbook"
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: runbook-controller-script
---
apiVersion: v1
kind: Service
metadata:
  name: runbook-controller
  namespace: alerting
spec:
  type: ClusterIP
  selector:
    app: runbook-controller
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runbook-controller
  namespace: alerting
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: alerting-strip-runbook-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /runbook
            pathType: Prefix
            backend:
              service:
                name: runbook-controller
                port:
                  number: 8081
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-runbook-prefix
  namespace: alerting
spec:
  stripPrefix:
    prefixes:
      - /runbook
