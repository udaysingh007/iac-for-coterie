apiVersion: v1
kind: ConfigMap
metadata:
  name: runbook-controller-script
  namespace: alerting
data:
  app.py: |
    """Runbook controller: receives Grafana webhook, emails approval link, runs kubectl on approval."""
    import hashlib
    import json
    import os
    import smtplib
    import subprocess
    import time
    import uuid
    from email.mime.text import MIMEText
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse

    GMAIL_USER = os.environ["GMAIL_USER"]
    GMAIL_APP_PASSWORD = os.environ["GMAIL_APP_PASSWORD"]
    ALERT_RECIPIENT = os.environ.get("ALERT_RECIPIENT", GMAIL_USER)
    CONTROLLER_EXTERNAL_URL = os.environ["CONTROLLER_EXTERNAL_URL"]

    pending_approvals = {}

    REMEDIATION = {
        "cmd": ["kubectl", "rollout", "undo", "deployment/candidate-api", "-n", "dev"],
        "desc": "kubectl rollout undo deployment/candidate-api -n dev",
        "summary": "Roll back candidate-api to previous known-good version",
    }

    def generate_token(alert_id):
        raw = f"{alert_id}-{time.time()}-{uuid.uuid4().hex}"
        return hashlib.sha256(raw.encode()).hexdigest()[:32]

    def send_email(to, subject, body_html):
        msg = MIMEText(body_html, "html")
        msg["Subject"] = subject
        msg["From"] = GMAIL_USER
        msg["To"] = to
        with smtplib.SMTP("smtp.gmail.com", 587) as s:
            s.starttls()
            s.login(GMAIL_USER, GMAIL_APP_PASSWORD)
            s.send_message(msg)
        print(f"Email sent to {to}: {subject}")

    def run_remediation(token):
        entry = pending_approvals[token]
        print(f"Running remediation for token {token}")
        try:
            result = subprocess.run(
                REMEDIATION["cmd"],
                capture_output=True, text=True, timeout=30,
            )
            entry["status"] = "executed"
            entry["result"] = result.stdout + result.stderr
            print(f"Remediation result: {entry['result']}")
            return True, entry["result"]
        except Exception as e:
            entry["status"] = "failed"
            entry["result"] = str(e)
            print(f"Remediation failed: {e}")
            return False, str(e)

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            if self.path == "/webhook":
                content_len = int(self.headers.get("Content-Length", 0))
                body = self.rfile.read(content_len)
                try:
                    alert_data = json.loads(body)
                except json.JSONDecodeError:
                    alert_data = {"raw": body.decode(errors="replace")}

                alert_id = str(uuid.uuid4())[:8]
                token = generate_token(alert_id)
                pending_approvals[token] = {
                    "status": "pending",
                    "alert_data": alert_data,
                    "created_at": time.time(),
                }

                approve_url = f"{CONTROLLER_EXTERNAL_URL}/approve/{token}"
                subject = "candidate-api Alert - Approval Required for Rollback"
                body_html = f"""
                <h2>candidate-api SLO Alert Fired</h2>
                <p>Availability has dropped below the 99.9% SLO target.</p>
                <p><strong>Alert ID:</strong> {alert_id}</p>
                <p><strong>Time:</strong> {time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}</p>
                <h3>Proposed Remediation</h3>
                <p><code>{REMEDIATION['desc']}</code></p>
                <p>{REMEDIATION['summary']}</p>
                <br>
                <a href="{approve_url}"
                   style="background-color:#28a745;color:white;padding:12px 24px;
                          text-decoration:none;border-radius:4px;font-size:16px;">
                   Approve Rollback
                </a>
                <br><br>
                <p style="color:#666;font-size:12px;">
                  Or copy this URL: {approve_url}
                </p>
                """
                send_email(ALERT_RECIPIENT, subject, body_html)

                self.send_response(200)
                self.end_headers()
                self.wfile.write(json.dumps({"status": "email_sent", "token": token}).encode())
                return

            self.send_response(404)
            self.end_headers()

        def do_GET(self):
            parsed = urlparse(self.path)
            path = parsed.path.rstrip("/")

            # --- Pending approvals page (linked from Grafana alert annotation) ---
            if path == "/pending":
                rows = ""
                for token, entry in sorted(pending_approvals.items(), key=lambda x: x[1]["created_at"], reverse=True):
                    created = time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime(entry["created_at"]))
                    status = entry["status"]
                    if status == "pending":
                        action = f'<a href="{CONTROLLER_EXTERNAL_URL}/approve/{token}" style="background-color:#28a745;color:white;padding:6px 16px;text-decoration:none;border-radius:4px;">Approve</a>'
                    else:
                        action = f'<span style="color:#6c757d;">{status}</span>'
                    rows += f"<tr><td>{created}</td><td>{status}</td><td>{action}</td></tr>"

                if not rows:
                    rows = '<tr><td colspan="3" style="text-align:center;color:#888;">No alerts received yet</td></tr>'

                self.send_response(200)
                self.end_headers()
                self.wfile.write(f"""
                <html><head><title>Runbook Controller</title></head>
                <body style="font-family:sans-serif;max-width:700px;margin:40px auto;">
                <h2>Runbook Controller &mdash; Pending Approvals</h2>
                <p>Remediation: <code>{REMEDIATION['desc']}</code></p>
                <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;width:100%;">
                <tr style="background:#f0f0f0;"><th>Time</th><th>Status</th><th>Action</th></tr>
                {rows}
                </table>
                <br><p style="color:#888;font-size:12px;">Auto-refreshes every 15s</p>
                <script>setTimeout(()=>location.reload(), 15000);</script>
                </body></html>
                """.encode())
                return

            if path.startswith("/approve/"):
                token = path.split("/approve/", 1)[1]

                if not token or token not in pending_approvals:
                    self.send_response(400)
                    self.end_headers()
                    self.wfile.write(b"""
                    <html><body style="font-family:sans-serif;max-width:600px;margin:40px auto;">
                    <h2 style="color:#dc3545;">Invalid or Expired Token</h2>
                    <p>This approval link is no longer valid.</p>
                    </body></html>""")
                    return

                entry = pending_approvals[token]
                if entry["status"] != "pending":
                    self.send_response(200)
                    self.end_headers()
                    self.wfile.write(f"""
                    <html><body style="font-family:sans-serif;max-width:600px;margin:40px auto;">
                    <h2 style="color:#6c757d;">Already Processed</h2>
                    <p><strong>Status:</strong> {entry['status']}</p>
                    <h3>Output:</h3>
                    <pre>{entry.get('result', '')}</pre>
                    </body></html>""".encode())
                    return

                entry["status"] = "approved"
                success, output = run_remediation(token)

                self.send_response(200)
                self.end_headers()
                status_color = "#28a745" if success else "#dc3545"
                self.wfile.write(f"""
                <html><body style="font-family:sans-serif;max-width:600px;margin:40px auto;">
                <h2 style="color:{status_color};">
                  Rollback {'Executed Successfully' if success else 'Failed'}
                </h2>
                <h3>Command:</h3>
                <pre>{REMEDIATION['desc']}</pre>
                <h3>Output:</h3>
                <pre>{output}</pre>
                </body></html>
                """.encode())
                return

            if parsed.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return

            self.send_response(404)
            self.end_headers()

        def log_message(self, format, *args):
            print(f"{self.address_string()} - {format % args}")

    if __name__ == "__main__":
        port = int(os.environ.get("PORT", "8081"))
        server = HTTPServer(("0.0.0.0", port), Handler)
        print(f"Runbook controller listening on :{port}")
        server.serve_forever()
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runbook-controller
  namespace: alerting
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runbook-controller
  namespace: dev
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runbook-controller
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: runbook-controller
    namespace: alerting
roleRef:
  kind: Role
  name: runbook-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runbook-controller
  namespace: alerting
  labels:
    app: runbook-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runbook-controller
  template:
    metadata:
      labels:
        app: runbook-controller
    spec:
      serviceAccountName: runbook-controller
      initContainers:
        - name: install-kubectl
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              wget -O /shared/kubectl "https://dl.k8s.io/release/$(wget -qO- https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x /shared/kubectl
          volumeMounts:
            - name: shared-bin
              mountPath: /shared
      containers:
        - name: controller
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8081
          env:
            - name: PATH
              value: "/shared:/usr/local/bin:/usr/bin:/bin"
            - name: GMAIL_USER
              value: "usingh@gmail.com"
            - name: ALERT_RECIPIENT
              value: "usingh@gmail.com"
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmail-credentials
                  key: app-password
            - name: CONTROLLER_EXTERNAL_URL
              value: "http://13.216.126.57:30080"
          volumeMounts:
            - name: script
              mountPath: /app
            - name: shared-bin
              mountPath: /shared
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: runbook-controller-script
        - name: shared-bin
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: runbook-controller
  namespace: alerting
spec:
  type: NodePort
  selector:
    app: runbook-controller
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30080
