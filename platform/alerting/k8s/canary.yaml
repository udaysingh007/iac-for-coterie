apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-script
  namespace: alerting
data:
  server.py: |
    """Canary pod: healthy for HEALTHY_DURATION seconds, then returns 503."""
    import http.server
    import os
    import time

    HEALTHY_DURATION = int(os.environ.get("HEALTHY_DURATION", "120"))
    PORT = int(os.environ.get("PORT", "8080"))
    start_time = time.time()

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            elapsed = time.time() - start_time
            if self.path == "/healthz":
                if elapsed < HEALTHY_DURATION:
                    self.send_response(200)
                    self.end_headers()
                    self.wfile.write(b"ok")
                else:
                    self.send_response(503)
                    self.end_headers()
                    self.wfile.write(b"degraded")
            else:
                self.send_response(200)
                self.end_headers()
                self.wfile.write(f"canary up {elapsed:.0f}s\n".encode())

        def log_message(self, format, *args):
            print(f"{self.address_string()} - {format % args}")

    if __name__ == "__main__":
        server = http.server.HTTPServer(("0.0.0.0", PORT), Handler)
        print(f"Canary starting. Healthy for {HEALTHY_DURATION}s, then degrading.")
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: alerting
  labels:
    app: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary
  template:
    metadata:
      labels:
        app: canary
    spec:
      containers:
        - name: canary
          image: python:3.12-alpine
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8080
          env:
            - name: HEALTHY_DURATION
              value: "120"
          volumeMounts:
            - name: script
              mountPath: /app
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: canary-script
