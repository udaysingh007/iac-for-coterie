# kube-prometheus-stack Helm values
# Stripped-down stable config for single-node k3s on r6i.xlarge.
# Sidecars removed — datasource and dashboards provisioned statically.

# -------------------------------------------------------------------------
# Grafana
# -------------------------------------------------------------------------
grafana:
  enabled: true
  adminUser: admin
  # adminPassword injected at deploy time via --set grafana.adminPassword

  # Datasource sidecar disabled — provisioned statically below.
  # Dashboard sidecar enabled — picks up ConfigMaps with grafana_dashboard=1 label.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      folder: /tmp/dashboards
      searchNamespace: monitoring
    datasources:
      enabled: false

  # Static Prometheus datasource — no sidecar needed.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          url: http://kube-prometheus-stack-prometheus:9090
          access: proxy
          isDefault: true
          jsonData:
            timeInterval: 30s
        - name: Loki
          uid: loki
          type: loki
          url: http://loki-gateway.monitoring.svc.cluster.local
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 1000

  # Load Node Exporter Full (gnet ID 1860) — shows real CPU/mem/disk/net
  # data immediately since node-exporter is running on the same node.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
    database:
      wal: true
    feature_toggles:
      kubernetesDashboards: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Traefik Ingress — http://<VM_PUBLIC_IP>/grafana
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - ""
    path: /grafana

# -------------------------------------------------------------------------
# Prometheus
# -------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 7d
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    replicas: 1
    storageSpec: {}
    # Discover PodMonitors and ServiceMonitors from all namespaces
    podMonitorNamespaceSelector: {}
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

# -------------------------------------------------------------------------
# Alertmanager — not needed for this assessment
# -------------------------------------------------------------------------
alertmanager:
  enabled: false

# -------------------------------------------------------------------------
# Supporting exporters
# -------------------------------------------------------------------------
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# k3s does not expose these endpoints — disable to avoid broken scrape targets
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
