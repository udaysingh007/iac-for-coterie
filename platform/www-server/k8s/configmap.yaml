apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-page
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Coterie Platform</title>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 720px; width: 100%; padding: 2rem; }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #f8fafc; }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; text-decoration: none; color: inherit; transition: border-color 0.2s, transform 0.2s; }
        .card:hover { border-color: #60a5fa; transform: translateY(-2px); }
        .card-icon { margin-bottom: 0.75rem; height: 40px; display: flex; align-items: center; }
        .card-icon img { height: 36px; width: auto; }
        .card-icon span { font-size: 2rem; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; margin-bottom: 0.25rem; }
        .card-desc { font-size: 0.85rem; color: #94a3b8; }
        .env-dev { border-left: 3px solid #22c55e; }
        .env-test { border-left: 3px solid #f59e0b; }
        .footer { margin-top: 2rem; text-align: center; color: #475569; font-size: 0.8rem; }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>Coterie Platform</h1>
        <p class="subtitle">SRE Take-Home Assessment &mdash; Infrastructure Dashboard</p>
        <div class="grid">
          <a href="/grafana" class="card">
            <div class="card-icon"><img src="/grafana/public/img/grafana_icon.svg" alt="Grafana"></div>
            <div class="card-title">Grafana</div>
            <div class="card-desc">Monitoring dashboards, metrics, and SLO tracking</div>
          </a>
          <a href="/argocd" class="card">
            <div class="card-icon"><img src="/argocd/assets/images/logo.png" alt="ArgoCD"></div>
            <div class="card-title">ArgoCD</div>
            <div class="card-desc">GitOps continuous delivery and deployment status</div>
          </a>
          <a href="/dev/" class="card env-dev">
            <div class="card-icon"><span>&#x1F6A7;</span></div>
            <div class="card-title">Dev Environment</div>
            <div class="card-desc">Candidate API &mdash; development deployment</div>
          </a>
          <a href="/test/" class="card env-test">
            <div class="card-icon"><span>&#x2705;</span></div>
            <div class="card-title">Test Environment</div>
            <div class="card-desc">Candidate API &mdash; promoted/validated build</div>
          </a>
          <a href="http://13.216.126.57:30080/pending" class="card" style="border-left: 3px solid #ef4444;">
            <div class="card-icon"><span>&#x1F6A8;</span></div>
            <div class="card-title">Alert Approvals</div>
            <div class="card-desc">Alerts requiring manual review and approval for remediation</div>
          </a>
        </div>
        <div class="footer">k3s on AWS EC2 &bull; Prometheus + Grafana &bull; ArgoCD</div>
      </div>
    </body>
    </html>
  nginx.conf: |
    server {
      listen 8080;
      location = / {
        root /usr/share/nginx/html;
        index index.html;
      }
      location = /index.html {
        root /usr/share/nginx/html;
      }
      location / {
        return 404;
      }
    }
