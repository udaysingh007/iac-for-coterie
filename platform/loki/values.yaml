# Loki Helm values — single-binary mode for single-node k3s.
# Logs stored on local filesystem (no S3 needed for this assessment).

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi

# Disable microservice components — not needed in SingleBinary mode
gateway:
  enabled: true
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Chunk and results cache — disable for simplicity on single-node
chunksCache:
  enabled: false
resultsCache:
  enabled: false
